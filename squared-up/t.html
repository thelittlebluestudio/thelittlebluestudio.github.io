<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>Squared Up: a trip from a friend</title>
<!-- Trip link page. A friend sent receipts from Squared Up; this page opens the app with them (squaredup://trip#...), or
     lists them for someone who does not have the app yet. Everything shown comes from the part of the link after "#",
     which the browser never sends to this server; nothing is stored anywhere. Source of truth: squared-up-app/web/t.html,
     published next to v.html. Format: #2z<base64url deflate-raw JSON> made by doSendTrip() / packTrip() in www/index.html;
     this page only reads its receipt list "s" ([label, total already formatted]) and counts people "p". -->
<style>
:root{--bg:#F4F5F7;--surface:#fff;--surface-2:#EEF0F3;--ink:#101828;--muted:#5D6B82;--line:#E3E6EB;--accent:#2563EB;--pos:#15803D;--neg:#B42318;--hi:#EAF1FF;--hero-fg:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0B0F17;--surface:#151B26;--surface-2:#1E2633;--ink:#F2F4F7;--muted:#98A2B3;--line:#273041;--accent:#6E9BFF;--pos:#4ADE80;--neg:#FF8A80;--hi:#1A2742;--hero-fg:#0B0F17}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px;display:grid;gap:16px}
.brand{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
h1{margin:2px 0 0;font-size:28px;line-height:1.15}
.sub{color:var(--muted);font-size:14px}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);margin-left:4px}
.hero{background:var(--accent);color:var(--hero-fg);border-radius:20px;padding:18px 20px}
.hero small{opacity:.85;font-size:13px}.hero div{font-size:34px;font-weight:800;letter-spacing:-.01em}
.sec{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:6px 2px -6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 14px}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.card>.row:first-child,.card>.curh+.row{border-top:0}
.row.me{background:var(--hi);margin:0 -14px;padding:10px 14px}
.dot{width:28px;height:28px;border-radius:50%;color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.amt{font-weight:700;text-align:right;white-space:nowrap}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.small{grid-column:2/4;color:var(--muted);font-size:13px;margin-top:-2px}
.pay{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.pay span{color:var(--muted);font-size:14px}
.curh{font-size:13px;font-weight:700;color:var(--muted);padding:10px 0 2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:8px 14px;font:inherit;font-size:15px;font-weight:600;min-height:40px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
.you{background:var(--surface);border:1.5px solid var(--accent);border-radius:16px;padding:14px;display:grid;gap:6px}
.you b{font-size:18px}
.rc h2{font-size:17px;margin:0;display:flex;justify-content:space-between;gap:10px}
.rc .rsub{color:var(--muted);font-size:13px;padding:2px 0 6px}
details{border-top:1px solid var(--line);padding:8px 0}
summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:14px;min-height:32px;display:flex;align-items:center}
.it{display:grid;grid-template-columns:1fr auto;gap:0 10px;padding:6px 0;font-size:14px}
.it .who{grid-column:1/3;color:var(--muted);font-size:12px}
.it.mine .who{color:var(--accent);font-weight:600}
.foot{color:var(--muted);font-size:13px;text-align:center;display:grid;gap:6px;margin-top:8px}
.foot a{color:var(--accent);font-weight:600}
.err{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.go{display:block;text-align:center;background:var(--accent);color:var(--hero-fg);border-radius:16px;padding:16px;font-size:17px;font-weight:700;text-decoration:none}
.go.ghost{background:var(--surface);color:var(--accent);border:1.5px solid var(--accent)}
</style>
</head>
<body>
<main id="app" aria-live="polite"><p class="sub">Opening…</p></main>
<script>
(() => {
  'use strict';
  const app = document.getElementById('app');
  const ZH = /^zh/i.test(navigator.language || '') && !/hant|-tw|-hk|-mo/i.test(navigator.language || '');
  const T = ZH ? {
    brand: 'Squared Up 分账', title: n => '朋友发来的 ' + n + ' 张账单', people: n => n + ' 人', open: '添加到 Squared Up',
    how: '点上面的按钮，在 App 里打开这些账单。你会先看到要添加什么，再确认。', none: '还没有 App？', get: '在 App Store 下载 Squared Up', play: '在 Google Play 下载 Squared Up',
    paste: '也可以复制朋友发来的整条消息，在 App 第一步点“粘贴朋友发来的行程”。', cut: '这个链接不完整', cutMsg: '链接可能被截断了。请让朋友重新发一次。',
    foot: '这个页面只读取链接本身，不会在网上保存任何内容。', receipt: '账单' } : {
    brand: 'Squared Up', title: n => n === 1 ? '1 receipt from a friend' : n + ' receipts from a friend', people: n => n === 1 ? '1 person' : n + ' people', open: 'Add to Squared Up',
    how: 'Tap the button to open these receipts in the app. It shows you what will be added before anything changes.', none: "Don't have the app yet?", get: 'Get Squared Up on the App Store', play: 'Get Squared Up on Google Play',
    paste: 'Or copy the whole message your friend sent and use "Paste a trip from a friend" on the app\'s first step.', cut: 'This link is not complete', cutMsg: 'Part of the link may have been cut off. Ask your friend to send it again.',
    foot: 'This page was made from the link itself: nothing is stored online.', receipt: 'Receipt' };
  const APP_STORE = 'https://apps.apple.com/app/id6830590775', PLAY = 'https://play.google.com/store/apps/details?id=com.horne.squaredup';
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
  const add = (parent, ...kids) => { kids.forEach(k => k && parent.appendChild(k)); return parent; };
  const str = (v, max = 200) => (typeof v === 'string' ? v : v == null ? '' : String(v)).slice(0, max);
  const link = (cls, text, href) => { const a = el('a', cls, text); a.href = href; a.rel = 'noopener'; return a; };
  document.documentElement.lang = ZH ? 'zh-Hans' : 'en-GB'; document.title = T.brand;
  function footer() { return add(el('div', 'foot'), el('div', '', T.foot)); }
  function stores() {
    const android = /android/i.test(navigator.userAgent);
    return add(el('div', 'you'), el('b', '', T.none), link('', android ? T.play : T.get, android ? PLAY : APP_STORE), el('div', 'sub', T.paste));
  }
  function fail() { app.textContent = ''; add(app, el('div', 'brand', T.brand), add(el('div', 'err'), el('h1', '', T.cut), el('p', 'sub', T.cutMsg)), footer()); }
  async function main() {
    const h = location.hash, m = h.match(/^#2([zj])([A-Za-z0-9_-]+)$/);
    if (!m || h.length > 4e6) return fail();
    let o;
    try {
      const bin = atob(m[2].replace(/-/g, '+').replace(/_/g, '/')), raw = Uint8Array.from(bin, c => c.charCodeAt(0));
      const bytes = m[1] === 'z' ? new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer()) : raw;
      if (bytes.length > 2e7) return fail();
      o = JSON.parse(new TextDecoder().decode(bytes));
    } catch { return fail(); }
    if (!o || typeof o !== 'object' || o.v !== 2 || !Array.isArray(o.r)) return fail();
    const list = (Array.isArray(o.s) ? o.s : []).slice(0, 400), n = o.r.length, np = Array.isArray(o.p) ? o.p.length : 0;
    app.textContent = '';
    add(app, el('div', 'brand', T.brand), add(el('div'), el('h1', '', T.title(n)), el('div', 'sub', T.people(np))));
    add(app, link('go', T.open, 'squaredup://trip' + h), el('p', 'sub', T.how));
    if (list.length) {
      const card = el('div', 'card');
      list.forEach(x => { const row = el('div', 'it'); add(row, el('span', '', str(Array.isArray(x) ? x[0] : '', 60) || T.receipt), el('span', 'amt', str(Array.isArray(x) ? x[1] : '', 30))); card.appendChild(row); });
      app.appendChild(card);
    }
    add(app, stores(), footer());
  }
  main();
})();
</script>
</body>
</html>
